    <!-- Primary SEO -->
    <title>Rockstar Radar — Intraday opening-range radar for Indian (NSE) markets</title>

    <meta name="keywords" content="NSE intraday, opening range breakout, ORB scanner, intraday trading India, FYERS API, intraday stock screener, trade journal, intraday signals, Nifty intraday" />

    <!-- Structured data (SEO + GEO: helps search engines and AI assistants understand the product) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "Rockstar Radar",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "Web",
          "description": "A real-time NSE intraday opening-range breakout radar for Indian markets. Connect your own broker to get ranked intraday setups with entry, stop-loss and targets, a smart daily watchlist, and a trade journal. Paper-trading first; the user confirms every trade.",
          "featureList": [
            "Live opening-range breakout radar ranked by strength",
            "Smart daily long/short watchlist with entry, stop-loss and targets",
            "Risk-free accelerated market simulation to practise and learn",
            "Paper trading and auto paper-trading of the algo to validate it",
            "Live order placement through your own broker (you confirm every order)",
            "Trade journal and performance insights (win rate, expectancy in R, daily P&L)",
            "Bring your own broker (FYERS; Zerodha, Upstox, Angel One and more planned)"
          ],
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Rockstar Radar?",
              "acceptedAnswer": { "@type": "Answer", "text": "Rockstar Radar is a real-time intraday opening-range breakout (ORB) radar for Indian (NSE) markets. It scans liquid stocks live, ranks breakout setups, and shows entry, stop-loss and targets. You connect your own broker and confirm every trade yourself." }
            },
            {
              "@type": "Question",
              "name": "Which brokers does it support?",
              "acceptedAnswer": { "@type": "Answer", "text": "FYERS is supported today, with Zerodha, Upstox, Angel One, Dhan, Groww, Paytm Money and 5paisa planned. You connect your own broker account; your login and data stay yours." }
            },
            {
              "@type": "Question",
              "name": "Does it place trades automatically?",
              "acceptedAnswer": { "@type": "Answer", "text": "For live orders, no — you review and confirm every order; it never fires a real order on its own. It can auto paper-trade (simulated, no money) so you can watch how the algorithm would perform before trading live." }
            },
            {
              "@type": "Question",
              "name": "Can I practise without risking money?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. Rockstar Radar has a built-in accelerated market simulation that plays a full synthetic trading session in minutes through the real algorithm, so learners can practise and users can test features any time without waiting for live market hours. You can also paper-trade on the live feed. Paper, simulation and live data are kept completely separate." }
            },
            {
              "@type": "Question",
              "name": "What is paper trading vs live trading here?",
              "acceptedAnswer": { "@type": "Answer", "text": "Paper trading tracks simulated fills, exits and P&L against the live feed with no real money. Live trading routes orders to your own connected broker. An admin sets paper or live per user, and the two P&L records never mix. Auto paper-trading lets the algorithm trade on paper so you can judge its edge before going live." }
            },
            {
              "@type": "Question",
              "name": "What is the difference between Running P&L and Realised P&L?",
              "acceptedAnswer": { "@type": "Answer", "text": "Running P&L is your live total for the current, in-progress trading session: trades already closed this session plus open positions marked to the latest market price. It moves as prices move. Realised P&L is only what is booked once a session has ended — closing a trade mid-session does not realise it, it stays in Running until the session closes. In the practice simulation (which loops continuously) nothing is ever booked, so everything shows as Running. The same figures appear identically on the Trades and Insights pages." }
            },
            {
              "@type": "Question",
              "name": "Do I need to log in to my broker every day?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. SEBI regulations require a fresh broker login each trading day for all Indian brokers; programmatic token refresh is not allowed. Rockstar Radar makes this a one-tap daily login." }
            }
          ]
        }
      ]
    }
    </script>
  </head>
