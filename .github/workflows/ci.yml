name: CI

# Runs on every PR targeting main. Required to pass before a PR can be merged (branch protection).
# No secrets, no deploy — just prove the app builds, so a broken build never reaches main → prod.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Frontend: the real validation (this is what npm run build does in the prod image) ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # ---- Backend: install deps + import the app so a bad import/missing dep fails the PR ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend deps
        run: pip install -r requirements.txt
      - name: Syntax + import check
        env:
          SESSION_SECRET: ci-dummy-not-a-real-secret
          RADAR_SCHED: '0'
          RADAR_ORDER_ENGINE: '0'
        run: |
          python -m compileall -q server radar launch.py
          python -c "import server.main; import radar.engine; import server.alerting; print('backend imports OK')"
      - name: Backend tests
        env:
          SESSION_SECRET: ci-dummy-not-a-real-secret
          RADAR_SCHED: '0'
          RADAR_ORDER_ENGINE: '0'
        run: |
          pip install pytest
          python -m pytest -q

      # ---- Infra validation (OKE migration): Terraform + Helm must stay valid ----
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: Terraform fmt + validate
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Helm lint + kubeconform
        run: |
          curl -sSL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz | tar xz
          HELM=./linux-amd64/helm
          VALS="--set image.repository=r/app --set domain=x.sslip.io --set oci.vaultId=v --set oci.compartmentId=c --set letsencryptEmail=a@b.c --set publicBaseUrl=https://x"
          $HELM lint deploy/helm/rockstar $VALS
          $HELM template r deploy/helm/rockstar $VALS > /tmp/rendered.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas /tmp/rendered.yaml
