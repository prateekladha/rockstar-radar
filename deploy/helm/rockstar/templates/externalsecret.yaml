# External Secrets Operator syncs OCI Vault secrets into a k8s Secret the pods mount as env.
# The worker nodes authenticate to Vault with their instance principal (no keys in the cluster).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rockstar-vault
spec:
  provider:
    oracle:
      region: {{ .Values.oci.region | quote }}
      vault: {{ .Values.oci.vaultId | quote }}
      compartment: {{ .Values.oci.compartmentId | quote }}
      principalType: InstancePrincipal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rockstar-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: rockstar-vault
    kind: SecretStore
  target:
    name: rockstar-secrets
    creationPolicy: Owner
  data:
    # k8s secret key  <-  OCI Vault secret name (rockstar-radar-<key>)
    - { secretKey: db-dsn,               remoteRef: { key: rockstar-radar-db-dsn } }
    - { secretKey: db-app-password,      remoteRef: { key: rockstar-radar-db-app-password } }
    - { secretKey: session-secret,       remoteRef: { key: rockstar-radar-session-secret } }
    - { secretKey: internal-token,       remoteRef: { key: rockstar-radar-internal-token } }
    - { secretKey: encryption-key,       remoteRef: { key: rockstar-radar-encryption-key } }
    - { secretKey: google-client-id,     remoteRef: { key: rockstar-radar-google-client-id } }
    - { secretKey: google-client-secret, remoteRef: { key: rockstar-radar-google-client-secret } }
