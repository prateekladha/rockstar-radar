apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner
  labels:
    app: scanner
    {{- include "rockstar.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Recreate: never two scanner managers alive at once (they would fight over the FYERS API locks and
  # double-subscribe). A short gap on a scanner deploy is fine — the web keeps serving and falls back.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: scanner } }
  template:
    metadata:
      labels: { app: scanner }
    spec:
      {{- include "rockstar.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: scanner
          # Pinned separately from web so a routine web deploy does NOT re-template (restart) the
          # stateful scanner. Defaults to the shared tag on first install.
          image: {{ .Values.image.repository }}:{{ .Values.scanner.imageTag | default .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "rockstar.commonEnv" . | nindent 12 }}
            - { name: RADAR_SCHED, value: "1" }        # owns the market-open scheduler + supervisor
            - { name: RADAR_ORDER_ENGINE, value: "1" } # owns the paper order engine
            # SCANNER_HOST intentionally unset -> runs scanners locally and serves /internal
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8080" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 20, failureThreshold: 3 }
          startupProbe:   { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 60 }
          resources: {{- toYaml .Values.scanner.resources | nindent 12 }}
          {{- include "rockstar.containerSecurity" . | nindent 10 }}
          volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: scanner-data }
---
apiVersion: v1
kind: Service
metadata: { name: scanner, labels: { app: scanner } }
spec:
  selector: { app: scanner }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: scanner-data }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.scanner.storageClass }}
  resources: { requests: { storage: {{ .Values.scanner.storageSize }} } }
