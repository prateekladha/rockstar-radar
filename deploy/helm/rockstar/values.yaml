# Defaults; per-environment overrides in values-oci.yaml (set by CI from Terraform outputs).
image:
  repository: ""        # e.g. ap-mumbai-1.ocir.io/<ns>/rockstar-radar/app
  tag: latest
  pullPolicy: IfNotPresent

# OCI Vault the External Secrets store reads (instance principal on the worker nodes).
oci:
  region: ap-mumbai-1
  vaultId: ""
  compartmentId: ""

domain: ""              # intraday.live at cutover; an <ip>.sslip.io test domain before that
letsencryptEmail: ""    # cert-manager ACME registration

# Non-secret app config shared by both pods.
publicBaseUrl: ""       # https://<domain>

# Namespace fence for the SHARED cluster (co-tenant with dt-telekom prod). Headroom for web+scanner
# while capping a runaway. Disable only on a dedicated cluster.
resourceQuota:
  enabled: true
  requestsCpu: "1"
  requestsMemory: 2Gi
  limitsCpu: "2"
  # Raised 3Gi -> 4Gi for the sim-worker pod (768Mi limit) while preserving web HPA headroom:
  # web(512)x2 + scanner(1536) + sim-worker(768) = 3328Mi. Nodes have ~13.6Gi allocatable each and are
  # <55% used, so this stays well within the shared cluster and keeps fencing dt-telekom.
  limitsMemory: 4Gi

# web: stateless, horizontally scalable, serves the SPA/API and proxies to the scanner.
web:
  replicas: 1
  hpa: { min: 1, max: 3, cpu: 70 }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

# scanner: stateful (live FYERS feed + per-user subprocesses + day-state on a PVC). Single replica,
# Recreate — never two managers fighting over the FYERS locks. Deployed only when scanner code changes.
scanner:
  # false on a routine auto PR-merge deploy -> the scanner Deployment is NOT rendered and the running
  # pod is left untouched (helm.sh/resource-policy:keep), so an auto-merge can never roll the live feed.
  # CI sets this true only on a manual "Run workflow" with deploy_scanner=true (or first install).
  deployScanner: false
  imageTag: ""                # pinned by CI to the currently-deployed tag on a web-only deploy
  storageSize: 10Gi
  storageClass: oci-bv        # OCI Block Volume (default on OKE)
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { memory: 1536Mi }

# sim-worker: runs backtests/simulations off the web pod and off the live-feed scanner. Stateless and
# claim-based (polls the DB for 'pending' SimRun rows), so eviction is harmless — no PVC, no Service.
# Tracks image.tag (updates on every normal deploy). Set enabled:false to park it (sims then queue).
simWorker:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 768Mi }
