# Bootstrap RBAC for the GitHub Actions CI deployer (OCI user `rockstar-radar-ci`).
#
# This is the grant that LETS CI run `helm upgrade`, so it cannot itself be installed by Helm — it is
# applied ONCE, out of band, by a cluster admin:
#   kubectl apply -f deploy/k8s/ci-rbac.yaml
#
# It is a ClusterRole (a permission *definition*) bound by a NAMESPACED RoleBinding, so the CI user's
# rights apply only inside the `rockstar-radar` namespace. On the shared dt-selfcare-oke cluster this
# means CI can never touch dt-telekom's workloads. The resource set matches exactly what
# deploy/helm/rockstar renders (see its templates). The built-in `admin` ClusterRole is deliberately
# NOT reused: it cannot manage ResourceQuota, which the chart includes.
#
# Subject is the CI user's OCID — OKE maps the kubeconfig token identity to the user OCID as the
# Kubernetes username.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rockstar-ci-deployer
rules:
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims, resourcequotas, secrets, configmaps, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments/scale, deployments/status, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [issuers, certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, secretstores]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rockstar-ci-deployer
  namespace: rockstar-radar
subjects:
  - kind: User
    name: ocid1.user.oc1..aaaaaaaasjivd3ekvnssd2izfjl7425ebf4og5wsuu7f2w5alxkffuexktwq
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: rockstar-ci-deployer
  apiGroup: rbac.authorization.k8s.io
